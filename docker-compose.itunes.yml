services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radar_itunes
      POSTGRES_PASSWORD: radar
      POSTGRES_USER: radar
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar_itunes"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - radar-itunes-postgres:/var/lib/postgresql/data
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radar_itunes_test
      POSTGRES_PASSWORD: radar
      POSTGRES_USER: radar
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar_itunes_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  radar-itunes-postgres:
