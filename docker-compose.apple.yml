services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${APPLE_DATABASE_NAME:?APPLE_DATABASE_NAME is required}
      POSTGRES_PASSWORD: radar
      POSTGRES_USER: radar
    ports:
      - "127.0.0.1:${APPLE_DATABASE_PORT:?APPLE_DATABASE_PORT is required}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d ${APPLE_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - radar-apple-postgres:/var/lib/postgresql/data
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${APPLE_TEST_DATABASE_NAME:?APPLE_TEST_DATABASE_NAME is required}
      POSTGRES_PASSWORD: radar
      POSTGRES_USER: radar
    ports:
      - "127.0.0.1:${APPLE_TEST_DATABASE_PORT:?APPLE_TEST_DATABASE_PORT is required}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d ${APPLE_TEST_DATABASE_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  radar-apple-postgres:
